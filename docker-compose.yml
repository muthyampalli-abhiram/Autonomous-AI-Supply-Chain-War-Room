services:
  postgres:
    image: postgres:16
    container_name: warroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warroom
      POSTGRES_USER: warroom
      POSTGRES_PASSWORD: warroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warroom -d warroom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
